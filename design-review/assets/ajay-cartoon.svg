<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" fill="none">
  <title>Ajay waving hello</title>
  <desc>A classic cartoon portrait with swept dark hair, black glasses, a white sweatshirt and his right hand raised in a wave.</desc>
  <style>
    .wave-arm{transform-origin:119px 246px}
    svg:hover .wave-arm{animation:hello-wave .85s ease-in-out 3}
    @keyframes hello-wave{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}65%{transform:rotate(-5deg)}}
    @media(prefers-reduced-motion:reduce){.wave-arm{animation:none!important}}
  </style>
